<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0e2035">
<title>LifeLedger 生活帳本</title>
<style>
:root{--bg:#0e2035;--bg2:#16304d;--card:#ffffff;--ink:#121821;--ink2:#5b6574;--rule:#d9dfe6;--gold:#c9a45c;--accent:#1d5c8f;--bad:#b3372b;--field:#f6f8fa}
@media (prefers-color-scheme:dark){:root{--card:#151b23;--ink:#eef2f7;--ink2:#9aa5b4;--rule:#29313c;--accent:#7db4e6;--bad:#f0897c;--field:#1a212b}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.box{width:100%;max-width:380px;background:var(--card);border-radius:18px;padding:28px 24px 24px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.eyebrow{font:500 12px/1 ui-monospace,Consolas,Menlo,monospace;letter-spacing:.2em;color:var(--gold)}
h1{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-weight:900;font-size:26px;letter-spacing:.04em;margin:10px 0 4px}
p.sub{margin:0 0 20px;color:var(--ink2);font-size:14px}
label.f{display:block;font-size:13px;color:var(--ink2);margin-bottom:6px}
.pw{display:flex;gap:8px}
input[type=password],input[type=text]{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--rule);border-radius:10px;padding:11px 12px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eye{font:inherit;font-size:13px;border:1px solid var(--rule);background:transparent;color:var(--ink2);border-radius:10px;padding:0 12px;cursor:pointer}
.go{width:100%;margin-top:14px;font:inherit;font-size:16px;font-weight:700;color:#fff;background:var(--bg);border:0;border-radius:10px;padding:12px;cursor:pointer}
@media (prefers-color-scheme:dark){.go{background:var(--accent);color:#0a1624}}
.go[disabled]{opacity:.6;cursor:progress}
.rem{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:13.5px;color:var(--ink2);cursor:pointer}
.rem input{margin-top:3px}
.msg{min-height:20px;margin-top:12px;font-size:13.5px;color:var(--bad)}
.foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule);font-size:12px;color:var(--ink2);line-height:1.6}
</style>
</head><body>
<form class="box" id="f" autocomplete="on">
  <div class="eyebrow">LIFELEDGER · 生活總帳</div>
  <h1>LifeLedger 生活帳本</h1>
  <p class="sub">內容已加密，請輸入密碼查看。</p>
  <input type="text" name="username" value="LifeLedger" autocomplete="username" hidden>
  <label class="f" for="pw">密碼</label>
  <div class="pw"><input id="pw" type="password" autocomplete="current-password" required><button type="button" class="eye" id="eye" aria-label="顯示密碼">顯示</button></div>
  <label class="rem"><input type="checkbox" id="rem"><span>在這台裝置記住密碼（只在自己的手機或電腦勾選）</span></label>
  <button class="go" id="go">解鎖</button>
  <div class="msg" id="msg" role="alert"></div>
  <div class="foot">密碼只在你的瀏覽器裡用來解開內容，不會傳到任何地方。</div>
</form>

<script>
(function(){
  var B=JSON.parse(document.getElementById('blob').textContent), KEY='cardflow-pw';
  var f=document.getElementById('f'), pw=document.getElementById('pw'), go=document.getElementById('go'), msg=document.getElementById('msg'), rem=document.getElementById('rem');
  function get(s,k){try{return s.getItem(k)}catch(e){return null}}
  function set(s,k,v){try{v==null?s.removeItem(k):s.setItem(k,v)}catch(e){}}
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  async function open(p){
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
    var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(B.salt),iterations:B.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(B.iv)},k,b64(B.ct));
    return new TextDecoder().decode(pt);
  }
  async function unlock(p,auto){
    go.disabled=true; go.textContent='解鎖中…'; msg.textContent='';
    try{
      var html=await open(p);
      set(sessionStorage,KEY,p);
      if(!auto) set(localStorage,KEY,rem.checked?p:null);
      document.open(); document.write(html); document.close();
    }catch(e){
      if(auto){set(localStorage,KEY,null);set(sessionStorage,KEY,null)}
      else{msg.textContent=window.crypto&&crypto.subtle?'密碼不對，請再試一次。':'這個瀏覽器不支援解密，請改用 Safari 或 Chrome。';pw.select()}
      go.disabled=false; go.textContent='解鎖';
    }
  }
  f.addEventListener('submit',function(e){e.preventDefault(); if(pw.value) unlock(pw.value,false)});
  document.getElementById('eye').addEventListener('click',function(){var t=pw.type==='password';pw.type=t?'text':'password';this.textContent=t?'隱藏':'顯示'});
  var saved=get(sessionStorage,KEY)||get(localStorage,KEY);
  if(get(localStorage,KEY)) rem.checked=true;
  if(saved) unlock(saved,true); else pw.focus();
})();
</script>
