<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>LifeLedger</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#0e2035;--ink2:#4a5a6e;--line:#e3e7ec;--gold:#b08a3e;--navy:#0e2035;--err:#b3372b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1420;--card:#121e2d;--ink:#eef2f6;--ink2:#b9c3cf;--line:#2a3646;--gold:#d8b46a;--navy:#060d16;--err:#f0897c}}
:root[data-theme="dark"]{--bg:#0b1420;--card:#121e2d;--ink:#eef2f6;--ink2:#b9c3cf;--line:#2a3646;--gold:#d8b46a;--navy:#060d16;--err:#f0897c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;padding:20px}
.box{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 24px;box-shadow:0 10px 30px rgba(14,32,53,.08)}
.eb{font:700 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.2em;color:var(--gold)}
h1{font-size:22px;margin:10px 0 4px}
p{margin:0 0 14px;color:var(--ink2);font-size:14px}
label{display:block;font-size:13px;color:var(--ink2);margin:12px 0 4px}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:inherit}
button{width:100%;margin-top:16px;font:inherit;font-weight:700;padding:11px;border:0;border-radius:10px;background:var(--navy);color:#fff;cursor:pointer}
:root[data-theme="dark"] button{background:var(--gold);color:#0b1420}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button{background:var(--gold);color:#0b1420}}
.msg{min-height:1.4em;margin-top:10px;font-size:13.5px;color:var(--err)}
.links{display:flex;justify-content:space-between;margin-top:14px;font-size:13px}
.links a{color:var(--ink2)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box" id="box">
  <div class="eb">LIFELEDGER · 生活總帳</div>
  <h1 id="ttl">月報</h1>
  <p id="sub">用<b>你自己的</b>隨手記帳號登入（每個人只看得到自己的）。內容在你的電腦上就已加密，只有你的密碼解得開。</p>
  <form id="f" hidden>
    <label for="u">隨手記帳號</label><input id="u" autocomplete="username" required>
    <label for="pw">密碼</label><input id="pw" type="password" autocomplete="current-password" required>
    <button type="submit">打開</button>
  </form>
  <div class="msg" id="msg" role="status"></div>
  <div class="links"><a href="./?forgot=1">忘記密碼？</a><a href="./">← 隨手記</a><a id="other" href="view.html?p=book">生活帳本 →</a></div>
</div>
<script>window.LL_API="https://alexledger.netlify.app";</script>
<script>
(function(){
  var API=/^https?:\/\//.test(window.LL_API)?window.LL_API.replace(/\/$/,''):'';
  var P=(new URLSearchParams(location.search).get('p')==='book')?'book':'report';
  var NAME={report:'月報',book:'生活帳本'}[P];
  document.title='LifeLedger '+NAME; document.getElementById('ttl').textContent=NAME;
  var o=document.getElementById('other'); o.href='view.html?p='+(P==='book'?'report':'book'); o.textContent=(P==='book'?'月報':'生活帳本')+' →';
  try{var th=localStorage.getItem('ll-theme');if(th)document.documentElement.setAttribute('data-theme',th);}catch(e){}
  var $=function(i){return document.getElementById(i)}, msg=$('msg');
  function get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  function busy(t){msg.style.color='var(--ink2)';msg.innerHTML='<span class="spin"></span>'+t}
  function err(t){msg.style.color='';msg.textContent=t}
  async function open_(user,pw){
    busy('下載中…');
    var r=await fetch(API+'/api/ledger?page='+P,{headers:{'x-cf-user':encodeURIComponent(user),'x-cf-key':encodeURIComponent(pw)},cache:'no-store'});
    if(r.status===401){ $('f').hidden=false; return err('帳號或密碼不對'); }
    if(r.status===429){ $('f').hidden=false; return err('密碼錯太多次，請 15 分鐘後再試'); }
    if(!r.ok){ return err('連不上（'+r.status+'），請稍後再試'); }
    var j=await r.json();
    if(!j.blob){ $('f').hidden=true; return err('還沒有'+NAME+'。等你的電腦下一次自動更新（每天 07:30、12:30、16:30、20:30）就會出現。'); }
    busy('解密中…');
    var B=j.blob, html;
    try{
      var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
      var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(B.salt),iterations:B.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
      var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(B.iv)},k,b64(B.ct));
      if(B.gz){ var ds=new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip')); html=await new Response(ds).text(); }
      else html=new TextDecoder().decode(pt);
    }catch(e){ $('f').hidden=false; return err('登入成功，但這份內容是用舊密碼加密的：剛改過或重設過密碼的話，請在電腦上雙擊「設定精靈.bat」→【0b】填新密碼，再雙擊「立即更新月報.bat」，之後就能用新密碼打開。'); }
    try{localStorage.setItem('cf-user',user);localStorage.setItem('cf-pw',pw);}catch(e){}
    html=html.replace(/<head([^>]*)>/i,'<head$1><script>window.LL_ONLINE={page:"'+P+'",saved:"'+(j.savedAt||'')+'",api:"'+API+'"};<\/script>');
    document.open(); document.write(html); document.close();
  }
  $('f').addEventListener('submit',function(e){e.preventDefault();open_($('u').value.trim(),$('pw').value).catch(function(x){err('發生錯誤：'+x.message)})});
  var u=get('cf-user'),p=get('cf-pw');
  if(u&&p){ $('u').value=u; open_(u,p).catch(function(x){$('f').hidden=false;err('發生錯誤：'+x.message)}); }
  else $('f').hidden=false;
})();
</script>
</body>
</html>
