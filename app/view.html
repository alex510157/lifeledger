<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>LifeLedger</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#0e2035;--ink2:#4a5a6e;--line:#e3e7ec;--gold:#b08a3e;--navy:#0e2035;--err:#b3372b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1420;--card:#121e2d;--ink:#eef2f6;--ink2:#b9c3cf;--line:#2a3646;--gold:#d8b46a;--navy:#060d16;--err:#f0897c}}
:root[data-theme="dark"]{--bg:#0b1420;--card:#121e2d;--ink:#eef2f6;--ink2:#b9c3cf;--line:#2a3646;--gold:#d8b46a;--navy:#060d16;--err:#f0897c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;padding:20px}
.box{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 24px;box-shadow:0 10px 30px rgba(14,32,53,.08)}
.eb{font:700 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.2em;color:var(--gold)}
h1{font-size:22px;margin:10px 0 4px}
p{margin:0 0 14px;color:var(--ink2);font-size:14px}
label{display:block;font-size:13px;color:var(--ink2);margin:12px 0 4px}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:inherit}
button{width:100%;margin-top:16px;font:inherit;font-weight:700;padding:11px;border:0;border-radius:10px;background:var(--navy);color:#fff;cursor:pointer}
:root[data-theme="dark"] button{background:var(--gold);color:#0b1420}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button{background:var(--gold);color:#0b1420}}
.msg{min-height:1.4em;margin-top:10px;font-size:13.5px;color:var(--err)}
.links{display:flex;justify-content:space-between;margin-top:14px;font-size:13px}
.links a{color:var(--ink2)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box" id="box">
  <div class="eb">LIFELEDGER · 生活總帳</div>
  <h1 id="ttl">月報</h1>
  <p id="sub">用<b>你自己的</b>隨手記帳號登入（每個人只看得到自己的）。內容在你的電腦上就已加密，只有你的密碼解得開。</p>
  <form id="f" hidden>
    <label for="u">隨手記帳號</label><input id="u" autocomplete="username" required>
    <label for="pw">密碼</label><input id="pw" type="password" autocomplete="current-password" required>
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rm" checked style="width:18px;height:18px;margin:0;padding:0"> 記住這台裝置（下次不用再輸入密碼）</label>
    <p style="margin:0;font-size:12px;color:var(--ink2)">只在自己的手機或電腦勾選。共用或公用電腦請不要勾，關掉這個分頁就會自動登出。</p>
    <button type="submit">打開</button>
  </form>
  <div class="msg" id="msg" role="status"></div>
  <div class="links"><a href="./?forgot=1">忘記密碼？</a><a href="./">← 隨手記</a><a id="other" href="view.html?p=book">生活帳本 →</a></div>
</div>
<script>window.LL_API="https://alexledger.netlify.app";</script>
<script src="sync.js"></script>
<script>
/* 月報／生活帳本上方的切換列：隨手記・月報・生活帳本・⟳ 立即更新（請電腦馬上重算，不用等排程） */
function llBar(){
  if(document.getElementById('ll-sw'))return;
  var O=window.LL_ONLINE||{},API=O.api||'',P=O.page;
  var st=document.createElement('style');
  st.textContent='#ll-sw{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:9999;display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(14,32,53,.92);box-shadow:0 6px 20px rgba(0,0,0,.25);font:600 13px/1 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}'+
    '#ll-sw a,#ll-sw button{all:unset;cursor:pointer;color:#dfe6ee;padding:9px 12px;border-radius:999px;white-space:nowrap}#ll-sw a:hover,#ll-sw button:hover{background:rgba(255,255,255,.12)}'+
    '#ll-sw .on{background:#d8b46a;color:#0b1420}#ll-sw .rf.busy{color:#d8b46a}#ll-sw .rf.ok{background:#2e8b57;color:#fff}'+
    '#ll-msg{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:calc(max(12px,env(safe-area-inset-bottom)) + 52px);z-index:9999;max-width:min(320px,calc(100vw - 24px));background:#0e2035;color:#eef2f6;padding:10px 12px;border-radius:12px;font:13px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25)}'+
    '@media (max-width:520px){#ll-sw{left:50%;right:auto;transform:translateX(-50%)}#ll-sw a,#ll-sw button{padding:9px 10px}#ll-msg{left:12px;right:12px;max-width:none}}@media print{#ll-sw,#ll-msg{display:none}}';
  document.head.appendChild(st);
  var b=document.createElement('nav');b.id='ll-sw';b.setAttribute('aria-label','切換');
  b.innerHTML='<a href="./">📝 隨手記</a><a href="view.html?p=report"'+(P==='report'?' class="on" aria-current="page"':'')+'>📅 月報</a><a href="view.html?p=book"'+(P==='book'?' class="on" aria-current="page"':'')+'>📒 帳本</a><button type="button" class="rf" title="請電腦馬上更新">⟳ 更新</button>';
  document.body.appendChild(b);
  var rf=b.querySelector('.rf'),msg=null,T=0;
  function say(t,btn){if(!msg){msg=document.createElement('div');msg.id='ll-msg';msg.setAttribute('role','status');document.body.appendChild(msg)}msg.innerHTML=t;msg.hidden=false;clearTimeout(T);if(!btn)T=setTimeout(function(){msg.hidden=true},9000)}
  /* 密碼可能在 localStorage（記住這台裝置）或 sessionStorage（不記住），規則同 app/sync.js 的 credLoad；這段會被嵌進月報頁，所以不能用 LLSync */
  /* 登入金鑰（cf-lk，和密碼放同一邊）：伺服器確認過可以用才會存，有就送它、不送密碼（規則同 sync.js 的 credLoad、authFetch） */
  function cred(){var g=function(s,k){try{return s.getItem(k)||''}catch(e){return ''}},u=g(localStorage,'cf-user'),lp=g(localStorage,'cf-pw'),s=lp?localStorage:sessionStorage,lk='';
    try{var o=JSON.parse(g(s,'cf-lk')||'null');if(o&&typeof o.lk==='string'&&o.u===u.trim().toLowerCase())lk=o.lk}catch(e){}
    return [u,lp||g(sessionStorage,'cf-pw'),lk]}
  function H(){var c=cred(),h={'content-type':'application/json','x-cf-user':encodeURIComponent(c[0]),'x-cf-key':encodeURIComponent(c[2]||c[1])};if(c[2])h['x-cf-kind']='lk';return h}
  async function get(){var r=await fetch(API+'/api/ledger',{headers:H(),cache:'no-store'});if(!r.ok)throw new Error('連不上（'+r.status+'）');return r.json()}
  /* 「立即更新」的狀態：新版伺服器獨立存在 page=refresh（舊版伺服器沒有，就只看帳本裡的）；兩邊取比較新的 */
  async function getRf(){try{var r=await fetch(API+'/api/ledger?page=refresh',{headers:H(),cache:'no-store'});if(r.ok){var j=await r.json();if(j&&typeof j==='object')return j}}catch(e){}return {}}
  async function putRf(t){try{var r=await fetch(API+'/api/ledger?page=refresh',{method:'PUT',headers:H(),cache:'no-store',body:JSON.stringify({refreshReq:t})});return r.ok}catch(e){return false}}
  async function state(){var j=await get(),d=(j&&j.data)||{},f=await getRf(),df=f.refreshDone||0,dd=d.refreshDone||0;
    return {req:Math.max(d.refreshReq||0,f.refreshReq||0),done:Math.max(dd,df),ok:df>dd?f.refreshOk:d.refreshOk,enc:!!(j&&j.enc)}}
  var t0=O.saved?new Date(O.saved):null,hm=function(d){return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
  if(t0&&!isNaN(t0))rf.title='這份是 '+hm(t0)+' 更新的・按一下請電腦馬上更新';
  var REQ=0,POLL=0;
  function waiting(){rf.className='rf busy';rf.textContent='⟳ 更新中…';clearInterval(POLL);POLL=setInterval(check,45000)}
  async function check(){try{var s=await state();if(s.done>=REQ&&REQ){clearInterval(POLL);rf.className='rf ok';rf.textContent='✓ 好了・重新載入';rf.onclick=function(){location.reload()};say(s.ok===false?'電腦更新時出了問題，請看電腦上的「紀錄\\daily_log.txt」。':'電腦更新好了，按「重新載入」看最新的。',1)}}catch(e){}}
  (async function(){try{var s=await state();if(s.req>s.done&&Date.now()-s.req<3*3600e3){REQ=s.req;waiting()}}catch(e){}})();
  rf.onclick=async function(){
    if(rf.classList.contains('busy')){say('已經請電腦更新了，通常 10～15 分鐘內完成（電腦要開著、沒睡著）。好了這個按鈕會變綠色。');return}
    rf.textContent='⟳ 送出中…';
    try{
      /* 只在拿到完整帳本時才送出（只加 refreshReq 欄位）；拿不到就停下，絕不用空資料覆蓋帳本 */
      var sent=false,okRev=function(v){return Number.isSafeInteger(v)&&v>=0};   /* 版本號合約：≥ 0 的整數（見後端 ledger.mjs） */
      /* 帳本已經加密：這裡解不開也不需要解開，只寫獨立的 page=refresh（電腦端讀那裡） */
      var j0=await get();
      if(j0&&j0.enc){REQ=Date.now();if(!(await putRf(REQ)))throw new Error('存不進去，請稍後再按一次');sent=true}
      for(var k=0;k<3&&!sent;k++){var j=k?await get():j0,d=j&&j.data;
        if(!d||typeof d!=='object'||Array.isArray(d)||!Array.isArray(d.records)||!Array.isArray(d.cards)||!okRev(j.rev))throw new Error('雲端沒有回傳完整的帳本，所以沒有送出（你的資料沒有被改動）');
        REQ=Date.now();d.refreshReq=REQ;
        var r=await fetch(API+'/api/ledger',{method:'PUT',headers:H(),cache:'no-store',body:JSON.stringify({base:j.rev,data:d})});
        /* 200 也要帶有效的 rev，才能確認真的存進去；否則不宣告成功 */
        if(r.ok){var pj=null;try{pj=await r.json()}catch(x){}if(!pj||!okRev(pj.rev)||pj.rev<=j.rev)throw new Error('伺服器回應不完整，無法確認有沒有送出，請稍後再按一次');sent=true;break}if(r.status!==409)throw new Error('存不進去（'+r.status+'）')}
      if(!sent)throw new Error('另一台裝置也在存檔，請再按一次');
      if(!(j0&&j0.enc))putRf(REQ);   /* 帳本沒加密：舊版電腦端讀帳本裡的 refreshReq，新版讀 page=refresh，兩邊都寫（這邊失敗不影響） */
      waiting();say('已請電腦更新：通常 <b>10～15 分鐘</b>內完成（電腦要開著、沒睡著）。好了這個按鈕會變綠色，按一下重新載入。');
    }catch(e){rf.textContent='⟳ 更新';say('沒送出：'+(e.message||'網路有問題'))}
  };
}
(function(){
  var API=/^https?:\/\//.test(window.LL_API)?window.LL_API.replace(/\/$/,''):'';
  var P=(new URLSearchParams(location.search).get('p')==='book')?'book':'report';
  var NAME={report:'月報',book:'生活帳本'}[P];
  document.title='LifeLedger '+NAME; document.getElementById('ttl').textContent=NAME;
  var o=document.getElementById('other'); o.href='view.html?p='+(P==='book'?'report':'book'); o.textContent=(P==='book'?'月報':'生活帳本')+' →';
  try{var th=localStorage.getItem('ll-theme');if(th)document.documentElement.setAttribute('data-theme',th);}catch(e){}
  var $=function(i){return document.getElementById(i)}, msg=$('msg');
  var LS=(function(){try{return window.localStorage}catch(e){return null}})(), SS=(function(){try{return window.sessionStorage}catch(e){return null}})();
  var CR=LLSync.credLoad(LS,SS);   /* 記住這台裝置：密碼在 localStorage；不記住：在 sessionStorage（關掉分頁就清掉） */
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  function busy(t){msg.style.color='var(--ink2)';msg.innerHTML='<span class="spin"></span>'+t}
  function err(t){msg.style.color='';msg.textContent=t}
  async function open_(user,pw,remember){
    busy('登入中…');
    /* 新版伺服器：送登入金鑰、不送密碼（之前存過、同一組帳密就直接用；否則在這裡算） */
    var c={user:user,pw:pw,v2:(await LLSync.probeV2(function(u,o){return fetch(u,o)},API))===true,
           lk:(CR.pw===pw&&LLSync.normUser(CR.user)===LLSync.normUser(user))?CR.lk:null};
    if(c.v2&&!c.lk) c.lk=await LLSync.loginKey(user,pw);
    busy('下載中…');
    var r=await LLSync.authFetch(function(u,o){return fetch(u,o)},API,'/api/ledger?page='+P,{cache:'no-store'},c);
    if(r.status===401){ $('f').hidden=false; return err('帳號或密碼不對'); }
    if(r.status===429){ $('f').hidden=false; return err('密碼錯太多次，請 15 分鐘後再試'); }
    if(!r.ok){ return err('連不上（'+r.status+'），請稍後再試'); }
    var j=await r.json();
    if(!j.blob){ $('f').hidden=true; return err('還沒有'+NAME+'。等你的電腦下一次自動更新（每天 07:30、12:30、16:30、20:30）就會出現。'); }
    busy('解密中…');
    var B=j.blob, html;
    try{
      var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
      var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(B.salt),iterations:B.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
      var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(B.iv)},k,b64(B.ct));
      if(B.gz){ var ds=new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip')); html=await new Response(ds).text(); }
      else html=new TextDecoder().decode(pt);
    }catch(e){ $('f').hidden=false; return err('登入成功，但這份內容是用舊密碼加密的：剛改過或重設過密碼的話，請在電腦上雙擊「設定精靈.bat」→【0b】填新密碼，再雙擊「立即更新月報.bat」，之後就能用新密碼打開。'); }
    LLSync.credSave(LS,SS,user,pw,remember);
    if(c.lkOk&&c.lk) LLSync.credSaveLk(LS,SS,user,c.lk,remember);   /* 伺服器接受了這把登入金鑰才存（切換列會用它） */
    /* sync.js 也一起載入：頁面裡勾代墊、改分類時用 LLSync.pageLedger 讀寫帳本（登入金鑰、加密帳本） */
    html=html.replace(/<head([^>]*)>/i,'<head$1><script>window.LL_ONLINE={page:"'+P+'",saved:"'+(j.savedAt||'')+'",api:"'+API+'"};<\/script><script src="sync.js"><\/script>');
    html=html.replace(/<\/body>(?![\s\S]*<\/body>)/i,'<script>('+llBar.toString()+')()<\/script></body>');
    if(!/llBar|ll-sw/.test(html)) html+='<script>('+llBar.toString()+')()<\/script>';
    document.open(); document.write(html); document.close();
  }
  $('f').addEventListener('submit',function(e){e.preventDefault();open_($('u').value.trim(),$('pw').value,$('rm').checked).catch(function(x){err('發生錯誤：'+x.message)})});
  var u=CR.user||'',p=CR.pw||'';
  $('rm').checked=CR.remember; if(u) $('u').value=u;
  if(u&&p){ open_(u,p,CR.remember).catch(function(x){$('f').hidden=false;err('發生錯誤：'+x.message)}); }
  else $('f').hidden=false;
})();
</script>
</body>
</html>
